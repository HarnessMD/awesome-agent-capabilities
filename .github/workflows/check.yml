name: Check the list

# Every pull request: the data files against catalog.schema.json, with plain
# Node and no packages. No secret is used here, and the job can only read.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the data files
        run: node scripts/check.mjs
