name: Check the list

# Every pull request: the data files against catalog.schema.json, then the
# whole list built with the Munder Difflin app's own check. Plain Node, no
# packages. No secret is used here, and the job can only read.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Check the data files
        run: node scripts/check.mjs
      - name: Build the list with the app's check
        run: node scripts/publish.mjs --check
